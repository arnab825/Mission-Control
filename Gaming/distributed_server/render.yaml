services:
  - type: web
    name: mission-control-server
    runtime: python
    rootDir: Gaming/distributed_server
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker server:app --bind 0.0.0.0:$PORT --timeout 120 --max-requests 1000 --max-requests-jitter 100
    healthCheckPath: /health
    disk:
      name: mc-sqlite-fallback-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_BACKGROUND_WORKERS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FALLBACK_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
