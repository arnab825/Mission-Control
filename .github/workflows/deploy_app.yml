name: Deploy Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. 3.8.1)'
        required: false
        default: ''

concurrency:
  group: deploy-desktop-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Desktop App Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'Gaming/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: Gaming/frontend
        run: npm ci

      - name: Typecheck & Build Frontend
        working-directory: Gaming/frontend
        run: npm run build

      - name: Release Status Verification
        run: |
          TAG="${{ github.ref_name }}"
          echo "Desktop App release workflow verified for tag: ${TAG}"

  publish-to-winget:
    name: Submit Release to Windows Package Manager (WinGet)
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Compute Clean Version Number
        id: version_cleaner
        run: |
          RAW_TAG="${{ github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            CLEAN_VER="${{ github.event.inputs.version }}"
            CLEAN_VER="${CLEAN_VER#v}"
          fi
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${CLEAN_VER}"

      - name: Submit Release to microsoft/winget-pkgs
        uses: vedantmgoyal2009/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GH_TOKEN || secrets.GH_TOKEN }}
        with:
          identifier: arnab825.MissionControl
          version: ${{ steps.version_cleaner.outputs.clean_version }}
          installer-url: https://github.com/arnab825/Mission-Control/releases/download/${{ github.ref_name }}/MissionControl-Setup.exe
          token: ${{ secrets.WINGET_GH_TOKEN || secrets.GH_TOKEN }}
