name: "Contributor Milestone Recognition & Rewards"

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  recognize-contributor:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: "Process Contributor Milestone & Post Recognition"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.user) {
              console.log('No pull request found in event payload. Skipping.');
              return;
            }
            const author = pr.user.login;

            // 1. Exclude project founders, core maintainers, and automated bots.
            // Milestone perks and rewards are exclusively reserved to engage external/community developers!
            const EXCLUDED_ACCOUNTS = [
              context.repo.owner.toLowerCase(),
              'arnab825',
              'ani0811'
            ];

            if (
              pr.user.type === 'Bot' ||
              author.endsWith('[bot]') ||
              EXCLUDED_ACCOUNTS.includes(author.toLowerCase())
            ) {
              console.log(`Skipping core team maintainer or bot contributor: ${author}`);
              return;
            }

            // 2. Fetch user's public GitHub profile details (Full Name, Avatar, etc.)
            let fullName = author;
            let avatarUrl = pr.user.avatar_url;
            try {
              const userProfile = await github.rest.users.getByUsername({ username: author });
              if (userProfile.data && userProfile.data.name && userProfile.data.name.trim()) {
                fullName = userProfile.data.name.trim();
              }
              if (userProfile.data && userProfile.data.avatar_url) {
                avatarUrl = userProfile.data.avatar_url;
              }
            } catch (err) {
              console.warn('Could not fetch user profile details:', err.message);
            }

            // 3. Resiliently count merged PRs by this author via pulls API (avoids search API rate-limits)
            let authorMergedCount = 1;
            try {
              const pullsResp = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                per_page: 100
              });
              const userMerged = pullsResp.data.filter(p => 
                p.merged_at && 
                p.user && 
                p.user.login.toLowerCase() === author.toLowerCase()
              );
              authorMergedCount = Math.max(1, userMerged.length);
            } catch (err) {
              console.warn('Could not retrieve closed pull requests:', err.message);
            }

            // 4. Milestone Detection (Checks PR milestone or linked issue milestone)
            let milestoneTitle = pr.milestone ? pr.milestone.title : null;

            if (!milestoneTitle && pr.body) {
              const linkedMatches = [...pr.body.matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)].map(m => parseInt(m[1]));
              for (const issueNum of linkedMatches) {
                try {
                  const issueResp = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum
                  });
                  if (issueResp.data && issueResp.data.milestone) {
                    milestoneTitle = issueResp.data.milestone.title;
                    break;
                  }
                } catch (e) {
                  // Ignore issue lookup error
                }
              }
            }

            const milestoneDisplay = milestoneTitle || 'Active Project Milestone';
            const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());

            const isCoreSubsystem = labels.some(l => 
              l.includes('core') || 
              l.includes('telemetry') || 
              l.includes('directstorage') || 
              l.includes('ai') || 
              l.includes('adlx') || 
              l.includes('tensorrt') || 
              l.includes('subsystem')
            );

            // 5. Calculate Milestone Reward Tier based on strict project policy:
            // - Gold 🥇: Core Subsystem / architecture lead
            // - Silver 🥈: 2+ merged PRs tied to an active milestone
            // - Bronze 🥉: First-time merged PR / good-first-issue
            let tierName = 'First-Time Contributor';
            let tierEmoji = '🥉';
            let tierBadgeColor = 'cd7f32';
            let tierLogo = 'github';
            let tierLogoColor = 'white';

            if (isCoreSubsystem) {
              tierName = 'Core Subsystem Maintainer';
              tierEmoji = '🥇';
              tierBadgeColor = 'FFD700';
              tierLogo = 'nvidia';
              tierLogoColor = 'black';
            } else if (authorMergedCount >= 2 && milestoneTitle) {
              tierName = 'Milestone Builder';
              tierEmoji = '🥈';
              tierBadgeColor = 'C0C0C0';
              tierLogo = 'target';
              tierLogoColor = 'black';
            }

            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}`;
            const badgeUrl = `https://img.shields.io/static/v1?label=Mission%20Control&message=${encodeURIComponent(tierName)}&color=${tierBadgeColor}&style=for-the-badge&logo=${tierLogo}&logoColor=${tierLogoColor}`;
            const badgeMarkdown = `[![Mission Control ${tierName}](${badgeUrl})](${prUrl})`;

            // 6. Construct celebratory PR comment
            const commentBody = [
              `## 🎉 Congratulations, ${fullName}! (@${author})`,
              '',
              `Thank you for contributing to **Mission Control**! Your pull request **#${pr.number}** has been successfully merged into \`main\`.`,
              '',
              '---',
              '',
              '### 🎖️ Earned Milestone Perk & Official Profile Badge',
              '',
              `You have officially unlocked the **${tierEmoji} ${tierName}** perk tier!`,
              '',
              badgeMarkdown,
              '',
              '| Contributor | GitHub Handle | Earned Tier | Milestone / Scope | Verification |',
              '| :--- | :--- | :--- | :--- | :--- |',
              `| **${fullName}** | [@${author}](https://github.com/${author}) | ${tierEmoji} **${tierName}** | ${milestoneDisplay} | [Verified PR #${pr.number}](${prUrl}) |`,
              '',
              '---',
              '',
              '### 📋 Add Your Verified Badge to Your GitHub Profile',
              '',
              'Proudly showcase your contribution on your personal GitHub profile `README.md` or personal portfolio. This badge is cryptographically verified and links directly to this merged PR:',
              '',
              '```markdown',
              badgeMarkdown,
              '```',
              '',
              '---',
              '',
              '### 🎁 Automatic Contributor Recognition Unlocked:',
              '- [x] **Git Attribution**: Permanent commit attribution on the `main` branch.',
              `- [x] **Contributors Graph**: Automatically indexed into the [Official Contributors Graph](https://github.com/${context.repo.owner}/${context.repo.repo}/graphs/contributors).`,
              '- [x] **Hall of Fame**: Added to the Mission Control Contributor Registry.',
              '- [x] **Release Notes**: Automatically credited in the upcoming release notes under **New Contributors**.',
              '',
              `Keep building with us! Check out active [Milestones](https://github.com/${context.repo.owner}/${context.repo.repo}/milestones) and [Good First Issues](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/GOOD_FIRST_ISSUES.md) for future perks! 🚀`
            ].join('\n');

            // 7. Post comment to the PR
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
              console.log('Successfully posted milestone recognition comment on PR #' + pr.number);
            } catch (err) {
              console.error('Failed to post PR comment:', err.message);
            }

            // 8. Safely update CONTRIBUTORS.json via GitHub Contents API
            try {
              const filePath = 'CONTRIBUTORS.json';
              let currentSha = null;
              let contributorsList = [];

              try {
                const fileData = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath
                });
                currentSha = fileData.data.sha;
                const cleanBase64 = fileData.data.content.replace(/\r?\n/g, '');
                const contentStr = Buffer.from(cleanBase64, 'base64').toString('utf-8');
                contributorsList = JSON.parse(contentStr || '[]');
              } catch (e) {
                console.log('CONTRIBUTORS.json empty or needs initial commit.');
              }

              const existingIndex = contributorsList.findIndex(c => c.username.toLowerCase() === author.toLowerCase());
              const entry = {
                username: author,
                name: fullName,
                tier: tierName,
                badge: `${tierEmoji} ${tierName}`,
                badge_url: badgeUrl,
                pr_number: pr.number,
                pr_url: prUrl,
                avatar_url: avatarUrl,
                profile_url: `https://github.com/${author}`,
                merged_prs: authorMergedCount,
                last_milestone: milestoneDisplay,
                last_updated: new Date().toISOString()
              };

              if (existingIndex >= 0) {
                contributorsList[existingIndex] = { ...contributorsList[existingIndex], ...entry };
              } else {
                contributorsList.push(entry);
              }

              const updatedJson = JSON.stringify(contributorsList, null, 2) + '\n';
              const encodedContent = Buffer.from(updatedJson).toString('base64');

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: `chore(contributors): recognize ${fullName} (@${author}) [skip ci]`,
                content: encodedContent,
                sha: currentSha || undefined
              });

              console.log(`Successfully updated CONTRIBUTORS.json with ${fullName} (@${author})`);
            } catch (err) {
              console.warn('CONTRIBUTORS.json update note (may be skipped if branch protection applies):', err.message);
            }
