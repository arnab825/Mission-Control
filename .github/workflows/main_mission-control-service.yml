# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mission-control-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mission-control-service-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: Gaming/website
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SITE_URL: "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present

      - name: Prepare Standalone Deployment Directory
        working-directory: Gaming/website
        run: |
          rm -rf ../../deploy-pkg
          mkdir -p ../../deploy-pkg/.next
          cp -r .next/standalone/. ../../deploy-pkg/
          cp -r .next/static ../../deploy-pkg/.next/static
          cp -r public ../../deploy-pkg/public

      - name: Create deployment ZIP package
        run: |
          cd deploy-pkg
          zip -r ../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE506E0915EB42A68DE45EB7F0DB2707 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4B859F2FB3045B8A1982D527970EF9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D49FFBC56FB4887B3D9741BB7ED80D2 }}

      - name: Reset Deployment Status & Deploy with Azure CLI
        run: |
          echo "Resetting any stuck Kudu active status..."
          az webapp config appsettings set \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --settings WEBSITE_RUN_FROM_PACKAGE="1" SCM_COMMAND_IDLE_TIMEOUT="600" || true

          echo "Deploying zip package directly using Azure CLI..."
          az webapp deploy \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --src-path node-app.zip \
            --type zip \
            --clean true \
            --restart true