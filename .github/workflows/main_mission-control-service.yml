# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mission-control-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mission-control-service-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: Gaming/website
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SITE_URL: "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present

      - name: Prepare Standalone Deployment Directory
        working-directory: Gaming/website
        run: |
          rm -rf ../../deploy-pkg
          mkdir -p ../../deploy-pkg/.next
          cp -r .next/standalone/. ../../deploy-pkg/
          cp -r .next/static ../../deploy-pkg/.next/static
          cp -r public ../../deploy-pkg/public

      - name: Create deployment ZIP package
        run: |
          cd deploy-pkg
          zip -r ../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE506E0915EB42A68DE45EB7F0DB2707 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4B859F2FB3045B8A1982D527970EF9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D49FFBC56FB4887B3D9741BB7ED80D2 }}

      - name: Clear stale Kudu deployment lock
        run: |
          echo "Stopping app to release all deployment locks..."
          az webapp stop --resource-group "mission-control-rg" --name mission-control-service
          
          echo "Restarting SCM site to clear Kudu deployment state..."
          az webapp restart --resource-group "mission-control-rg" --name mission-control-service
          sleep 15
          
          echo "Deleting any active deployment markers..."
          az rest --method DELETE \
            --url "https://mission-control-service.scm.azurewebsites.net/api/deployments" \
            --skip-authorization-header || true
          sleep 5

      - name: Configure App for Run-From-Package
        run: |
          az webapp config appsettings set \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --settings \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              HOSTNAME=0.0.0.0 \
              NODE_ENV=production \
              PORT=8080 \
              WEBSITES_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: Deploy via Run-From-Package (bypasses Kudu entirely)
        run: |
          echo "Deploying ZIP using az webapp deploy --type zip (Run-From-Package mode)..."
          az webapp deploy \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --src-path node-app.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Set startup command and start app
        run: |
          az webapp config set \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --startup-file "node server.js"
          
          az webapp start --resource-group "mission-control-rg" --name mission-control-service
          
          echo "Deployment complete. Verifying health..."
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net/" || echo "000")
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 500 ] || [ "$HTTP_STATUS" = "000" ]; then
            echo "::warning::App returned HTTP $HTTP_STATUS — may need more startup time"
          fi