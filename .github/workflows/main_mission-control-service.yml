# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mission-control-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: Gaming/website
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SITE_URL: "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present

      - name: Prepare Standalone Deployment Directory
        working-directory: Gaming/website
        run: |
          mkdir -p ../../deploy-pkg/.next
          cp -r .next/standalone/* ../../deploy-pkg/ || true
          cp -r .next/static ../../deploy-pkg/.next/static || true
          cp -r public ../../deploy-pkg/public || true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-pkg
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE506E0915EB42A68DE45EB7F0DB2707 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4B859F2FB3045B8A1982D527970EF9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D49FFBC56FB4887B3D9741BB7ED80D2 }}

      - name: Deploy to Azure Web App (attempt 1)
        id: deploy-1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mission-control-service'
          slot-name: 'Production'
          package: deploy-pkg

      - name: Wait before retrying deployment
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Azure Web App (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mission-control-service'
          slot-name: 'Production'
          package: deploy-pkg

      - name: Wait before final deployment attempt
        if: steps.deploy-2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to Azure Web App (attempt 3)
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mission-control-service'
          slot-name: 'Production'
          package: deploy-pkg