# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mission-control-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mission-control-service-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: Gaming/website
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SITE_URL: "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present

      - name: Prepare Standalone Deployment Directory
        working-directory: Gaming/website
        run: |
          rm -rf ../../deploy-pkg
          mkdir -p ../../deploy-pkg/.next
          if [ -d .next/standalone/Gaming/website ]; then
            cp -r .next/standalone/Gaming/website/. ../../deploy-pkg/
            cp -rn .next/standalone/node_modules ../../deploy-pkg/ 2>/dev/null || true
          else
            cp -r .next/standalone/. ../../deploy-pkg/
          fi
          cp -r .next/static ../../deploy-pkg/.next/static
          cp -r public ../../deploy-pkg/public

      - name: Create deployment ZIP package
        run: |
          cd deploy-pkg
          zip -r ../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE506E0915EB42A68DE45EB7F0DB2707 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4B859F2FB3045B8A1982D527970EF9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D49FFBC56FB4887B3D9741BB7ED80D2 }}

      - name: Clear stale Kudu deployment lock
        run: |
          echo "Deleting any active deployment markers..."
          az rest --method DELETE \
            --url "https://mission-control-service.scm.azurewebsites.net/api/deployments" \
            --skip-authorization-header 2>/dev/null || true

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --settings \
              HOSTNAME=0.0.0.0 \
              NODE_ENV=production \
              PORT=8080 \
              WEBSITES_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              MONGODB_URI="${{ secrets.MONGODB_URI }}"

      - name: Deploy ZIP to App Service
        run: |
          echo "Deploying ZIP package with fast non-blocking upload..."
          az webapp deploy \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --src-path node-app.zip \
            --type zip \
            --clean true \
            --restart false \
            --async true \
            --track-status false

      - name: Set startup command and start app
        run: |
          az webapp config set \
            --resource-group "mission-control-rg" \
            --name mission-control-service \
            --startup-file "node server.js"
          
          echo "Starting web app (ensures state is Running)..."
          az webapp start --resource-group "mission-control-rg" --name mission-control-service
          
          echo "Restarting app to pick up latest code and env vars..."
          az webapp restart --resource-group "mission-control-rg" --name mission-control-service
          
          echo "Waiting 25 seconds for cold start..."
          sleep 25
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mission-control-service-g7hfgye5hcamc9f2.centralindia-01.azurewebsites.net/" || echo "000")
          echo "Health check status: $HTTP_STATUS"